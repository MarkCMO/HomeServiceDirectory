[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"
  included_files = ["data/**", "netlify/functions/_*.js"]

# Drip email processor - runs every hour
[functions.drip-processor]
  schedule = "0 * * * *"

# Commission vesting checker - runs daily at 6am UTC
[functions.commission-vester]
  schedule = "0 6 * * *"

# Daily queue builder for all reps - runs daily at 5pm UTC (12pm EST)
[functions.queue-builder]
  schedule = "0 17 * * *"

# --- Headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com"

# --- Redirects ---

# API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

