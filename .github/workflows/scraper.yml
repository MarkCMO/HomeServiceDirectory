name: Google Maps Business Scraper

on:
  schedule:
    # Run Monday, Wednesday, Friday at 9am EST (2pm UTC)
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category slug to scrape (leave blank for all)'
        required: false
        default: ''
      state:
        description: 'State abbreviation (leave blank for all)'
        required: false
        default: ''
      rep_id:
        description: 'Rep UUID to assign POCs to'
        required: true
      max_cities:
        description: 'Max cities to scrape per run'
        required: false
        default: '20'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run scraper
        env:
          SCRAPER_KEY:      ${{ secrets.SCRAPER_KEY }}
          GOOGLE_MAPS_KEY:  ${{ secrets.GOOGLE_MAPS_KEY }}
          HSD_API_URL:      ${{ secrets.HSD_API_URL }}
          REP_ID:           ${{ github.event.inputs.rep_id || secrets.DEFAULT_REP_ID }}
          CATEGORY:         ${{ github.event.inputs.category || '' }}
          STATE:            ${{ github.event.inputs.state || '' }}
          MAX_CITIES:       ${{ github.event.inputs.max_cities || '20' }}
        run: node scripts/scraper.js

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-results-${{ github.run_id }}
          path: scripts/scraper-output/
          retention-days: 7
