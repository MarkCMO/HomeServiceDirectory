<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | HomeServiceDirectory</title>
  <meta name="description" content="Get in touch with HomeServiceDirectory. Questions about listings, pricing, partnerships, or general inquiries.">
  <link rel="canonical" href="https://homeservicedirectory.com/contact">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
</head>
<body>
  <section class="directory-hero" style="padding:120px 0 60px;text-align:center;">
    <div class="container">
      <h1>Contact <span style="color:var(--red);">Us</span></h1>
      <p>Questions, partnerships, or feedback - we'd love to hear from you.</p>
    </div>
  </section>

  <section class="section" style="padding-top:20px;">
    <div class="container" style="max-width:600px;">
      <div style="background:var(--white);border-radius:var(--radius-lg);padding:40px;border:1px solid var(--light-gray);">
        <div class="form-group">
          <label for="contactName">Name</label>
          <input type="text" id="contactName" class="form-input" placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="contactEmail">Email</label>
          <input type="email" id="contactEmail" class="form-input" placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label for="contactSubject">Subject</label>
          <select id="contactSubject" class="form-select">
            <option value="general">General Inquiry</option>
            <option value="listing">Listing Question</option>
            <option value="pricing">Pricing & Plans</option>
            <option value="partnership">Partnership</option>
            <option value="sponsor">City Sponsor Inquiry</option>
            <option value="bug">Report an Issue</option>
          </select>
        </div>
        <div class="form-group">
          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" class="form-textarea" rows="5" placeholder="How can we help?"></textarea>
        </div>
        <button onclick="submitContact()" id="contactBtn" class="btn btn-primary" style="width:100%;justify-content:center;">Send Message</button>
        <div id="contactSuccess" class="alert alert-success" style="display:none;margin-top:12px;"></div>
        <div id="contactError" class="alert alert-error" style="display:none;margin-top:12px;"></div>
      </div>

      <div style="text-align:center;margin-top:32px;color:var(--dark-gray);font-size:0.92rem;">
        <p>You can also email us directly at <a href="mailto:hello@homeservicedirectory.com">hello@homeservicedirectory.com</a></p>
      </div>
    </div>
  </section>

  <script src="/shared-layout.js"></script>
  <script>
    async function submitContact() {
      var btn = document.getElementById('contactBtn');
      var name = document.getElementById('contactName').value.trim();
      var email = document.getElementById('contactEmail').value.trim();
      var message = document.getElementById('contactMessage').value.trim();
      if (!name || !email || !message) {
        document.getElementById('contactError').textContent = 'Please fill in all fields.';
        document.getElementById('contactError').style.display = 'block';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        var res = await fetch('/api/contact-form', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, subject: document.getElementById('contactSubject').value, message })
        });
        document.getElementById('contactSuccess').textContent = 'Message sent! We will get back to you soon.';
        document.getElementById('contactSuccess').style.display = 'block';
        document.getElementById('contactError').style.display = 'none';
        btn.textContent = 'Sent!';
      } catch (e) {
        document.getElementById('contactError').textContent = 'Network error. Please try again.';
        document.getElementById('contactError').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send Message';
      }
    }
  </script>
</body>
</html>
