<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Details | HomeServiceDirectory</title>
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
</head>
<body>

  <section class="directory-hero" style="padding:100px 0 40px;" id="heroSection">
    <div class="container">
      <div id="breadcrumb" style="font-size:0.85rem;color:var(--mid-gray);margin-bottom:12px;"></div>
      <h1 id="providerName" style="font-size:2.2rem;">Loading...</h1>
      <p id="providerLocation" style="color:var(--ice);"></p>
    </div>
  </section>

  <section class="section" style="padding-top:24px;">
    <div class="container">
      <div class="grid-2" style="grid-template-columns:2fr 1fr;gap:40px;">

        <!-- Main Content -->
        <div>
          <!-- Badges -->
          <div id="badges" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;"></div>

          <!-- Description -->
          <div id="descriptionSection" style="background:var(--white);border-radius:var(--radius-lg);padding:24px;margin-bottom:24px;border:1px solid var(--light-gray);">
            <h2 style="font-size:1.2rem;margin-bottom:12px;">About This Provider</h2>
            <p id="providerDescription" style="color:var(--dark-gray);line-height:1.7;"></p>
          </div>

          <!-- Services -->
          <div id="servicesSection" style="background:var(--white);border-radius:var(--radius-lg);padding:24px;margin-bottom:24px;border:1px solid var(--light-gray);">
            <h2 style="font-size:1.2rem;margin-bottom:12px;">Services Offered</h2>
            <div id="categoryTags" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
          </div>

          <!-- Details -->
          <div id="detailsSection" style="background:var(--white);border-radius:var(--radius-lg);padding:24px;margin-bottom:24px;border:1px solid var(--light-gray);">
            <h2 style="font-size:1.2rem;margin-bottom:12px;">Business Details</h2>
            <div id="detailsGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"></div>
          </div>
        </div>

        <!-- Sidebar - Contact / Lead Form -->
        <div>
          <div style="background:var(--white);border-radius:var(--radius-lg);padding:24px;border:2px solid var(--red);position:sticky;top:80px;">
            <h3 style="font-size:1.1rem;margin-bottom:4px;">Request a Quote</h3>
            <p style="font-size:0.85rem;color:var(--dark-gray);margin-bottom:16px;">Your inquiry is sent exclusively to this provider.</p>

            <div class="form-group">
              <input type="text" id="leadName" class="form-input" placeholder="Your Name *">
            </div>
            <div class="form-group">
              <input type="email" id="leadEmail" class="form-input" placeholder="Email *">
            </div>
            <div class="form-group">
              <input type="tel" id="leadPhone" class="form-input" placeholder="Phone (optional)">
            </div>
            <div class="form-group">
              <select id="leadService" class="form-select">
                <option value="">Service Needed</option>
              </select>
            </div>
            <div class="form-group">
              <select id="leadUrgency" class="form-select">
                <option value="standard">Standard Request</option>
                <option value="urgent">Urgent - Need help soon</option>
                <option value="emergency">Emergency - Need help NOW</option>
              </select>
            </div>
            <div class="form-group">
              <textarea id="leadMessage" class="form-textarea" rows="3" placeholder="Describe your issue..." style="min-height:80px;"></textarea>
            </div>
            <button onclick="submitLead()" id="leadBtn" class="btn btn-primary" style="width:100%;justify-content:center;">Send Inquiry</button>
            <div id="leadSuccess" style="display:none;" class="alert alert-success" style="margin-top:12px;"></div>
            <div id="leadError" style="display:none;" class="alert alert-error" style="margin-top:12px;"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="/shared-layout.js"></script>
  <script>
    const slug = window.location.pathname.replace('/listing/', '').replace(/\/$/, '');

    const CATEGORIES = {
      'plumbing': 'Plumbing', 'water-damage': 'Water Damage', 'mold-remediation': 'Mold Remediation',
      'hvac': 'HVAC', 'electrical': 'Electrical', 'roofing': 'Roofing',
      'foundation-repair': 'Foundation Repair', 'fire-damage': 'Fire & Smoke', 'sewage-cleanup': 'Sewage Cleanup',
      'storm-damage': 'Storm Damage', 'asbestos-abatement': 'Asbestos Abatement', 'locksmith': 'Locksmith'
    };

    async function loadListing() {
      try {
        const res = await fetch('/api/listing-detail?slug=' + encodeURIComponent(slug));
        if (!res.ok) { document.getElementById('providerName').textContent = 'Listing not found'; return; }
        const p = await res.json();

        document.title = p.name + ' - ' + p.city + ', ' + p.state + ' | HomeServiceDirectory';
        document.getElementById('providerName').textContent = p.name;
        document.getElementById('providerLocation').textContent = p.city + ', ' + p.state + (p.zip ? ' ' + p.zip : '');

        // Breadcrumb
        const cat = (p.categories && p.categories[0]) || '';
        const catName = CATEGORIES[cat] || '';
        document.getElementById('breadcrumb').innerHTML = '<a href="/" style="color:var(--ice);">Home</a>' +
          (catName ? ' &rsaquo; <a href="/' + cat + '" style="color:var(--ice);">' + catName + '</a>' : '') +
          (p.stateSlug ? ' &rsaquo; <a href="/' + cat + '/' + p.stateSlug + '" style="color:var(--ice);">' + p.state + '</a>' : '') +
          ' &rsaquo; ' + p.name;

        // Badges
        var badgesHtml = '';
        if (p.is24x7) badgesHtml += '<span class="badge emergency">24/7 Emergency</span>';
        if (p.plan === 'elite' || p.plan === 'sponsor') badgesHtml += '<span class="badge verified">Verified</span>';
        if (p.plan === 'premium' || p.plan === 'elite' || p.plan === 'sponsor') badgesHtml += '<span class="badge premium">Featured</span>';
        if (p.licenseNumber) badgesHtml += '<span class="badge">Licensed</span>';
        document.getElementById('badges').innerHTML = badgesHtml;

        // Description
        document.getElementById('providerDescription').textContent = p.description || 'No description provided.';

        // Categories
        var catHtml = '';
        (p.categories || []).forEach(function(c) {
          catHtml += '<span style="display:inline-block;padding:6px 14px;background:var(--off-white);border:1px solid var(--light-gray);border-radius:20px;font-size:0.85rem;font-weight:500;">' + (CATEGORIES[c] || c) + '</span>';
        });
        document.getElementById('categoryTags').innerHTML = catHtml || '<span style="color:var(--mid-gray);">No categories listed</span>';

        // Details grid
        var details = '';
        if (p.phone) details += '<div><strong>Phone:</strong> <a href="tel:' + p.phone + '">' + p.phone + '</a></div>';
        if (p.website) details += '<div><strong>Website:</strong> <a href="' + p.website + '" target="_blank" rel="noopener">' + p.website.replace(/^https?:\/\//, '') + '</a></div>';
        if (p.yearsInBusiness) details += '<div><strong>Years in Business:</strong> ' + p.yearsInBusiness + '</div>';
        if (p.serviceRadius) details += '<div><strong>Service Radius:</strong> ' + p.serviceRadius + ' miles</div>';
        if (p.licenseNumber) details += '<div><strong>License:</strong> ' + p.licenseNumber + '</div>';
        if (p.insuranceInfo) details += '<div><strong>Insurance:</strong> ' + p.insuranceInfo + '</div>';
        if (p.rating) details += '<div><strong>Rating:</strong> ' + '&#9733;'.repeat(Math.round(p.rating)) + ' (' + p.rating.toFixed(1) + ')</div>';
        if (p.reviewCount) details += '<div><strong>Reviews:</strong> ' + p.reviewCount + '</div>';
        document.getElementById('detailsGrid').innerHTML = details || '<div>No additional details</div>';

        // Populate lead form service dropdown
        var sel = document.getElementById('leadService');
        (p.categories || []).forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = CATEGORIES[c] || c;
          sel.appendChild(opt);
        });

      } catch (e) {
        document.getElementById('providerName').textContent = 'Error loading listing';
      }
    }

    async function submitLead() {
      var btn = document.getElementById('leadBtn');
      var name = document.getElementById('leadName').value.trim();
      var email = document.getElementById('leadEmail').value.trim();
      if (!name || !email) {
        document.getElementById('leadError').textContent = 'Name and email are required.';
        document.getElementById('leadError').style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      document.getElementById('leadError').style.display = 'none';

      try {
        var res = await fetch('/api/provider-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            slug: slug,
            name: name,
            email: email,
            phone: document.getElementById('leadPhone').value.trim(),
            serviceType: document.getElementById('leadService').value,
            urgency: document.getElementById('leadUrgency').value,
            message: document.getElementById('leadMessage').value.trim()
          })
        });
        var result = await res.json();
        document.getElementById('leadSuccess').textContent = result.message || 'Inquiry sent!';
        document.getElementById('leadSuccess').style.display = 'block';
        btn.textContent = 'Sent!';
      } catch (e) {
        document.getElementById('leadError').textContent = 'Network error. Please try again.';
        document.getElementById('leadError').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send Inquiry';
      }
    }

    loadListing();
  </script>
</body>
</html>
